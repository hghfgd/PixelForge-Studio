name: Build PixelForge Studio Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PixelForge_Studio_v1.4.0_Animation_Assist/PixelForge_Studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:all

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Studio-Windows-Setup
          path: PixelForge_Studio_v1.4.0_Animation_Assist/PixelForge_Studio/release/*.exe
          if-no-files-found: error
          retention-days: 30
